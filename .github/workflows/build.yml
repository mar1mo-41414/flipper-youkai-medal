name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-fap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build FAP (Unleashed SDK)
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-index-url: https://up.unleashedflip.com/directory.json
          sdk-channel: release

      - name: Crypto test
        run: cc -o test/test_crypto test/test_crypto.c ym_crypto.c && ./test/test_crypto

      - uses: actions/upload-artifact@v4
        with:
          name: yokai_medal-${{ steps.build.outputs.suffix }}
          path: ${{ steps.build.outputs.fap-artifacts }}

      - name: Release (FAP)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.fap-artifacts }}
          body: |
            Built with Unleashed SDK: ${{ steps.build.outputs.suffix }}
            - `yokai_medal.fap`: standalone app (read/dump/clone/change-ID/write-to-blank-tag/erase). Put it in `apps/NFC/` on the SD card.
            - `yokai_medal_parser.fal`: read-only plugin for the stock NFC app (Apps → NFC → Read). Put it in `apps_data/nfc/plugins/`.
            Both files are built against the latest Unleashed release; the firmware version must match the SDK above.

  build-fal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # バージョンは指定しない。build_plugin.sh が build-fap 側 (ufbt の sdk-channel: release)
      # と同じ directory.json から最新リリースを解決し、使った値を unleashed_ref.txt に書く
      - name: Build FAL (NFC app plugin, via full Unleashed source + fbt)
        run: ./scripts/build_plugin.sh dist_plugin

      - name: Read resolved SDK version
        id: sdk
        run: echo "ref=$(cat dist_plugin/unleashed_ref.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: yokai_medal_parser-${{ steps.sdk.outputs.ref }}
          path: dist_plugin/yokai_medal_parser.fal

      - name: Release (FAL)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_plugin/yokai_medal_parser.fal
